{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="carte-formulaire">
  <h1>Se connecter</h1>
  <p class="aide">Retrouvez l’espace de travail de votre entreprise.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'core/_champs.html' %}
    <button class="bouton bouton-orange bouton-plein" type="submit">Se connecter</button>
  </form>
  <p class="aide centre">Pas encore de compte ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
</section>
{% endblock %}
